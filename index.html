<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>私人工具</title>
<style>
  :root{
    --bg:#f4f5f7; --card-bg:#ffffff; --text:#1f2430; --muted:#6b7280;
    --border:#e2e5ea; --accent:#3457d5; --accent-hover:#2a46b3; --err:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171c; --card-bg:#1f232b; --text:#e8eaef; --muted:#9aa1ad;
      --border:#2c313b; --accent:#5b7cf0; --accent-hover:#7391ff; --err:#ff6b5e;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:360px; background:var(--card-bg);
    border:1px solid var(--border); border-radius:14px; padding:32px 28px;
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
  }
  .card h1{font-size:19px; margin:0 0 6px; text-align:center;}
  .card p.sub{margin:0 0 24px; text-align:center; color:var(--muted); font-size:13px;}
  input[type=password]{
    width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--border);
    background:transparent; color:var(--text); font-size:15px; margin-bottom:14px;
  }
  input[type=password]:focus{outline:2px solid var(--accent); border-color:var(--accent);}
  label.remember{
    display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);
    margin-bottom:18px; user-select:none; cursor:pointer;
  }
  button#unlock{
    width:100%; padding:12px; border:none; border-radius:8px; background:var(--accent);
    color:#fff; font-size:15px; font-weight:600; cursor:pointer;
  }
  button#unlock:hover{background:var(--accent-hover);}
  button#unlock:disabled{opacity:0.6; cursor:default;}
  #err{color:var(--err); font-size:13px; text-align:center; margin:14px 0 0; display:none;}
  #status{color:var(--muted); font-size:13px; text-align:center; margin:14px 0 0;}
</style>
</head>
<body>

  <input type="password" id="pwd" autocomplete="off" inputmode="text" placeholder="密碼">
  <label class="remember"><input type="checkbox" id="remember" checked> 記住這台裝置</label>
  <button id="unlock" type="button">解鎖</button>
  <p id="err">密碼不正確</p>
  <p id="status" style="display:none;">正在解鎖…</p>
</div>

    var arr = new Uint8Array(bytes);
    for (var i = 0; i < arr.length; i++){ bin += String.fromCharCode(arr[i]); }
    return btoa(bin);
  }
  function safeGetItem(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function safeSetItem(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function safeRemoveItem(k){ try{ localStorage.removeItem(k); }catch(e){} }

  async function deriveKeyFromPassword(password, saltBytes, iterations){
    var enc = new TextEncoder();
    var passKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: saltBytes, iterations: iterations, hash: "SHA-256" },
      passKey,
      { name: "AES-GCM", length: 256 },
      true,
      ["decrypt"]
    );
  }

  async function decryptWithKey(key, ivBytes, ctBytes){
    var plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ivBytes }, key, ctBytes);
    return new TextDecoder("utf-8").decode(plainBuf);
  }

  function renderHtml(html){
    document.open();
    document.write(html);
    document.close();
  }

  function showError(){
    var errEl = document.getElementById("err");
    var pwdEl = document.getElementById("pwd");
    var statusEl = document.getElementById("status");
    var btn = document.getElementById("unlock");
    if (errEl) errEl.style.display = "block";
    if (statusEl) statusEl.style.display = "none";
    if (pwdEl){ pwdEl.value = ""; pwdEl.focus(); }
    if (btn) btn.disabled = false;
  }

  async function tryStoredKey(){
    var stored = safeGetItem(STORAGE_KEY);
    if (!stored) return false;
    var rawKeyBytes;
    try{ rawKeyBytes = b64ToBytes(stored); }catch(e){ safeRemoveItem(STORAGE_KEY); return false; }
    var html;
    try{
      var key = await crypto.subtle.importKey("raw", rawKeyBytes, { name: "AES-GCM" }, false, ["decrypt"]);
      var ivBytes = b64ToBytes(PAYLOAD.iv);
      var ctBytes = b64ToBytes(PAYLOAD.ct);
      html = await decryptWithKey(key, ivBytes, ctBytes);
    }catch(e){
      safeRemoveItem(STORAGE_KEY);
      return false;
    }
    renderHtml(html);
    return true;
  }

  async function attemptUnlock(password, remember){
    var btn = document.getElementById("unlock");
    var statusEl = document.getElementById("status");
    var errEl = document.getElementById("err");
    if (errEl) errEl.style.display = "none";
    if (statusEl) statusEl.style.display = "block";
    if (btn) btn.disabled = true;
    try{
      var saltBytes = b64ToBytes(PAYLOAD.salt);
      var ivBytes = b64ToBytes(PAYLOAD.iv);
      var ctBytes = b64ToBytes(PAYLOAD.ct);
      var derivedKey = await deriveKeyFromPassword(password, saltBytes, PAYLOAD.iter);
      var html = await decryptWithKey(derivedKey, ivBytes, ctBytes);
      if (remember){
        try{
          var rawKey = await crypto.subtle.exportKey("raw", derivedKey);
          safeSetItem(STORAGE_KEY, bytesToB64(rawKey));
        }catch(e){}
      }
      renderHtml(html);
    }catch(e){
      showError();
    }
  }

  function wireUpForm(){
    var btn = document.getElementById("unlock");
    var pwdEl = document.getElementById("pwd");
    var rememberEl = document.getElementById("remember");
    if (!btn || !pwdEl) return;
    btn.addEventListener("click", function(){
      attemptUnlock(pwdEl.value, !!(rememberEl && rememberEl.checked));
    });
    pwdEl.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); btn.click(); }
    });
  }

  wireUpForm();
  function autoUnlock(){ setTimeout(function(){ tryStoredKey(); }, 0); }
  if (document.readyState === "complete"){ autoUnlock(); }
  else { window.addEventListener("load", autoUnlock); }
})();
</script>
